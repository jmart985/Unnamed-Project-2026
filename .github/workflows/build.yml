name: Build

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
      - name: Restore
        run: dotnet restore UnnamedProject2026.slnx
      - name: Build
        run: dotnet build UnnamedProject2026.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test UnnamedProject2026.slnx --configuration Release --no-build
      - name: Import Godot project resources
        run: godot --headless --editor --build-solutions --path game --quit
      - name: Validate session profiles in Godot
        run: |
          set -euo pipefail
          godot --headless --path game -- --validate-session-profiles 2>&1 | tee "$RUNNER_TEMP/session-profile-validation.log"
          grep -Fq "SESSION PROFILE VALIDATION PASSED" "$RUNNER_TEMP/session-profile-validation.log"
      - name: Validate first-game scenario in Godot
        run: |
          set -euo pipefail
          godot --headless --path game -- --validate-first-game 2>&1 | tee "$RUNNER_TEMP/first-game-validation.log"
          grep -Fq "FIRST GAME VALIDATION PASSED" "$RUNNER_TEMP/first-game-validation.log"
      - name: Validate NPC schedule scenarios in Godot
        run: |
          set -euo pipefail
          godot --headless --path game -- --validate-schedules 2>&1 | tee "$RUNNER_TEMP/schedule-validation.log"
          grep -Fq "SCHEDULE VALIDATION PASSED" "$RUNNER_TEMP/schedule-validation.log"
      - name: Validate integrated NPC schedule scenario in Godot
        run: |
          set -euo pipefail
          godot --headless --path game -- --validate-schedule-integration 2>&1 | tee "$RUNNER_TEMP/schedule-integration-validation.log"
          grep -Fq "SCHEDULE INTEGRATION PASSED" "$RUNNER_TEMP/schedule-integration-validation.log"
      - name: Upload scenario logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/*validation.log
          if-no-files-found: ignore
