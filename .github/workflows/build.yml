name: Build

on:
  push:
  pull_request:

jobs:
  dotnet:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
      - name: Restore
        run: dotnet restore UnnamedProject2026.slnx
      - name: Build
        run: dotnet build UnnamedProject2026.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test UnnamedProject2026.slnx --configuration Release --no-build
      - name: Import Godot project resources
        run: godot --headless --editor --build-solutions --path game --quit
      - name: Run all registered Godot scenarios
        env:
          GODOT_VALIDATION_LOG_DIR: ${{ runner.temp }}
        run: bash scripts/validate-godot-scenarios.sh
      - name: Upload scenario logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-validation-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/validate-*.log
          if-no-files-found: warn
